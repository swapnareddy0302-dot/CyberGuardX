<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberGuardX | Register</title>

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #071021,
                #111b32,
                #1f2d55
            );

            padding: 20px;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-card {

            width: 100%;
            max-width: 500px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #f2f4f8
            );

            border-radius: 22px;

            padding: 40px 35px 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

        }


        /* =========================
           LOGO SECTION
        ========================= */

        .logo-section {

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 14px;

            margin-bottom: 30px;

        }

        .shield {

            width: 55px;
            height: 62px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #38bdf8
            );

            clip-path: polygon(
                50% 0%,
                90% 15%,
                90% 55%,
                50% 100%,
                10% 55%,
                10% 15%
            );

            color: white;

        }

        .brand-text h1 {

            color: #172554;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: 1px;

        }

        .brand-text p {

            margin-top: 4px;

            color: #64748b;

            font-size: 15px;

        }


        /* =========================
           INPUT FIELDS
        ========================= */

        .input-group {

            margin-bottom: 16px;

            position: relative;

        }

        .input-group input {

            width: 100%;

            padding: 15px 15px 15px 52px;

            border: 1px solid #cbd5e1;

            border-radius: 12px;

            outline: none;

            font-size: 16px;

            color: #1e293b;

            background: #f8fafc;

            transition: 0.3s;

        }

        .input-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);

            background: white;

        }

        .input-icon {

            position: absolute;

            left: 18px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

        }


        /* =========================
           CREATE ACCOUNT BUTTON
        ========================= */

        .create-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 7px 15px rgba(37, 99, 235, 0.25);

        }

        .create-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 22px rgba(37, 99, 235, 0.4);

        }


        /* =========================
           OR DIVIDER
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0;

            color: #64748b;

            font-size: 15px;

        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #cbd5e1;

        }


        /* =========================
           LOGIN SECTION
        ========================= */

        .login-text {

            text-align: center;

            color: #64748b;

            font-size: 15px;

        }

        .login-text a {

            color: #1d4ed8;

            text-decoration: none;

            font-weight: 600;

            margin-left: 5px;

        }

        .login-text a:hover {

            text-decoration: underline;

        }


        /* =========================
           FLASH MESSAGE
        ========================= */

        .flash {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 10px;

            text-align: center;

            background: #fee2e2;

            color: #991b1b;

            font-size: 14px;

        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 550px) {

            .register-card {

                max-width: 100%;

                padding: 35px 22px 28px;

            }

            .logo-section {

                flex-direction: column;

                text-align: center;

            }

            .brand-text h1 {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


    <div class="register-card">


        <!-- =========================
             FLASH MESSAGES
        ========================= -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- =========================
             LOGO AND BRAND NAME
        ========================= -->

        <div class="logo-section">

            <div class="shield">
                🔒
            </div>

            <div class="brand-text">

                <!-- CHANGE WEBSITE NAME HERE -->

                <h1>CyberGuardX</h1>

                <!-- CHANGE TAGLINE HERE -->

                <p>Secure. Scan. Protect.</p>

            </div>

        </div>


        <!-- =========================
             REGISTER FORM
        ========================= -->

        <form method="POST" action="/register">


            <!-- USERNAME -->

            <div class="input-group">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

            </div>


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
                class="create-btn"
            >

                Create Account

            </button>


        </form>


        <!-- =========================
             OR DIVIDER
        ========================= -->

        <div class="divider">

            OR

        </div>


        <!-- =========================
             LOGIN LINK
        ========================= -->

        <div class="login-text">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>


    </div>


</body>

</html>
