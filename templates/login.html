<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberGuardX Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>🛡 CyberGuardX</h1>

        <h3>Cloud Security Dashboard</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p style="margin-top: 20px;">
            Don't have an account?
            <a href="/register">
                Create Account
            </a>
        </p>

    </div>

</div>

</body>

</html>
